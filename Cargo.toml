[package]
name = "wtrm"
version = "0.0.1"
edition = "2021"
description = "Scan git worktrees on this machine and delete the ones you pick"
readme = "README.md"
rust-version = "1.85"

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.28"
ratatui = "0.29"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
